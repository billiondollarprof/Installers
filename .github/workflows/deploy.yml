name: Deploy

on:
  push:
    branches: [ccr-9b35ccd8-fso3n4]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: quote-recovery
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Find or create the D1 database
        run: |
          id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          if [ -z "$id" ]; then
            echo "Creating D1 database $DB_NAME"
            npx wrangler d1 create "$DB_NAME"
            id=$(npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid')
          fi
          [ -n "$id" ] || { echo "Could not find or create $DB_NAME"; exit 1; }
          echo "D1 database id: $id"
          sed -i "s/REPLACE_ME/$id/" wrangler.toml

      - name: Apply the schema
        run: npx wrangler d1 execute "$DB_NAME" --remote --file db/schema.sql

      - name: Deploy the Worker
        run: npx wrangler deploy | tee deploy.log

      - name: Copy secrets into the Worker
        env:
          COMPANIES_HOUSE_KEY: ${{ secrets.COMPANIES_HOUSE_KEY }}
          DESK_TOKEN: ${{ secrets.DESK_TOKEN }}
        run: |
          for name in COMPANIES_HOUSE_KEY DESK_TOKEN; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            else
              echo "::warning::GitHub secret $name is not set, so the Worker does not have it"
            fi
          done

      - name: Smoke test the live Worker
        run: |
          base=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$base" ] || { echo "No workers.dev URL in the deploy output"; exit 1; }
          echo "Live at $base"
          echo "### Live at $base" >> "$GITHUB_STEP_SUMMARY"
          check() {
            for i in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$base$1")
              [ "$code" = "$2" ] && { echo "$1 -> $code"; return 0; }
              sleep 5
            done
            echo "$1 returned $code, expected $2"; return 1
          }
          check /demo/ 200
          curl -s "$base/demo/" | cmp - public/demo/index.html && echo "/demo/ matches public/demo/index.html"
          check /api/health 200
          curl -s "$base/api/health"
